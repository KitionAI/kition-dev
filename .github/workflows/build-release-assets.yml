name: Build Runtime Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        type: string
      release_tag:
        description: Existing installer draft Release tag
        required: true
        type: string
      protocol_version:
        description: Runtime protocol version required by the public client
        required: true
        type: string
      runtime_ref:
        description: Private runtime branch, tag, or commit to build
        required: true
        default: main
        type: string
      public_repository:
        description: Public repository that owns the installer draft
        required: true
        default: KitionAI/kition
        type: string

permissions:
  contents: write

concurrency:
  group: runtime-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RUNTIME_SOURCE_REPOSITORY: KitionAI/kition-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.contract.outputs.version }}
      release_tag: ${{ steps.contract.outputs.release_tag }}
      protocol_version: ${{ steps.contract.outputs.protocol_version }}
      runtime_commit: ${{ steps.contract.outputs.runtime_commit }}
    steps:
      - name: Checkout private runtime source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.RUNTIME_SOURCE_REPOSITORY }}
          ref: ${{ inputs.runtime_ref }}
          token: ${{ secrets.KITION_RUNTIME_READ_TOKEN }}
          persist-credentials: false
          path: runtime-source

      - name: Validate dispatch contract
        id: contract
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PROTOCOL_VERSION: ${{ inputs.protocol_version }}
          RUNTIME_REF: ${{ inputs.runtime_ref }}
          PUBLIC_REPOSITORY: ${{ inputs.public_repository }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer: $VERSION" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG must equal v$VERSION" >&2
            exit 1
          fi
          if [[ ! "$PROTOCOL_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid protocol version: $PROTOCOL_VERSION" >&2
            exit 1
          fi
          if [[ ! "$RUNTIME_REF" =~ ^[0-9A-Za-z._/-]+$ || "$RUNTIME_REF" == -* || "$RUNTIME_REF" == *..* || "$RUNTIME_REF" == *//* ]]; then
            echo "Invalid runtime ref: $RUNTIME_REF" >&2
            exit 1
          fi
          if [[ "$PUBLIC_REPOSITORY" != "KitionAI/kition" ]]; then
            echo "Refusing unexpected public repository: $PUBLIC_REPOSITORY" >&2
            exit 1
          fi
          runtime_commit="$(git -C runtime-source rev-parse HEAD)"
          {
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
            echo "protocol_version=$PROTOCOL_VERSION"
            echo "runtime_commit=$runtime_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime-source/api/go.mod
          cache-dependency-path: runtime-source/api/go.sum

      - name: Test release source
        working-directory: runtime-source
        run: make verify

  build:
    needs: validate
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
            binary: kition-api
            archive: kition-runtime-${{ inputs.version }}-darwin-arm64.tar.gz
          - target: darwin-x64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: kition-api
            archive: kition-runtime-${{ inputs.version }}-darwin-x64.tar.gz
          - target: windows-x64
            os: windows-2022
            goos: windows
            goarch: amd64
            binary: kition-api.exe
            archive: kition-runtime-${{ inputs.version }}-windows-x64.zip
          - target: linux-x64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: kition-api
            archive: kition-runtime-${{ inputs.version }}-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout private runtime source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.RUNTIME_SOURCE_REPOSITORY }}
          ref: ${{ needs.validate.outputs.runtime_commit }}
          token: ${{ secrets.KITION_RUNTIME_READ_TOKEN }}
          persist-credentials: false
          path: runtime-source

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime-source/api/go.mod
          cache-dependency-path: runtime-source/api/go.sum

      - name: Build runtime
        shell: bash
        working-directory: runtime-source
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.validate.outputs.version }}
          PROTOCOL_VERSION: ${{ needs.validate.outputs.protocol_version }}
          BUILD_COMMIT: ${{ needs.validate.outputs.runtime_commit }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          ldflags="-s -w -X kition-api/pkg/runtimeinfo.Version=$VERSION -X kition-api/pkg/runtimeinfo.ProtocolVersion=$PROTOCOL_VERSION -X kition-api/pkg/runtimeinfo.BuildCommit=$BUILD_COMMIT"
          if [[ "$GOOS" == "darwin" && "$(go env GOHOSTARCH)" != "$GOARCH" ]]; then
            export CC="clang -arch $GOARCH"
          fi
          (cd api && CGO_ENABLED=1 go build -trimpath -ldflags "$ldflags" -o "../dist/stage/$BINARY" .)

      - name: Sign macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        working-directory: runtime-source
        env:
          MACOS_CSC_P12_BASE64: ${{ secrets.MACOS_CSC_P12_BASE64 }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CSC_P12_BASE64" || -z "$MACOS_CSC_KEY_PASSWORD" ]]; then
            echo "macOS runtime signing secrets are required" >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/kition-runtime-signing.p12"
          keychain="$RUNNER_TEMP/kition-runtime.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
          }
          trap cleanup EXIT
          python3 - "$certificate" <<'PY'
          import base64
          import os
          import sys

          with open(sys.argv[1], "wb") as output:
              output.write(base64.b64decode(os.environ["MACOS_CSC_P12_BASE64"]))
          PY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in certificate" >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$identity" "dist/stage/$BINARY"
          codesign --verify --strict --verbose=2 "dist/stage/$BINARY"

      - name: Add proprietary runtime notice
        shell: bash
        working-directory: runtime-source
        run: cp RUNTIME-LICENSE.txt dist/stage/RUNTIME-LICENSE.txt

      - name: Package macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        working-directory: runtime-source
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          tar -czf "dist/$ARCHIVE" -C dist/stage "$BINARY" RUNTIME-LICENSE.txt

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: runtime-source
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -LiteralPath "dist/stage/$env:BINARY", 'dist/stage/RUNTIME-LICENSE.txt' -DestinationPath "dist/$env:ARCHIVE"

      - name: Package Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        working-directory: runtime-source
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          tar -czf "dist/$ARCHIVE" -C dist/stage "$BINARY" RUNTIME-LICENSE.txt

      - name: Upload platform archive
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: runtime-source/dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  package-assets:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private runtime release tools
        uses: actions/checkout@v5
        with:
          repository: ${{ env.RUNTIME_SOURCE_REPOSITORY }}
          ref: ${{ needs.validate.outputs.runtime_commit }}
          token: ${{ secrets.KITION_RUNTIME_READ_TOKEN }}
          persist-credentials: false
          path: runtime-source

      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: runtime-source/dist/assets
          merge-multiple: true

      - name: Inspect archive contents
        shell: bash
        working-directory: runtime-source
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected_unix=$'RUNTIME-LICENSE.txt\nkition-api'
          for target in darwin-arm64 darwin-x64 linux-x64; do
            actual_unix="$(tar -tzf "dist/assets/kition-runtime-$VERSION-$target.tar.gz" | sed 's#^\./##' | sort)"
            [[ "$actual_unix" == "$expected_unix" ]] || { printf 'Unexpected %s archive entries:\n%s\n' "$target" "$actual_unix" >&2; exit 1; }
          done
          expected_windows=$'RUNTIME-LICENSE.txt\nkition-api.exe'
          actual_windows="$(unzip -Z1 "dist/assets/kition-runtime-$VERSION-windows-x64.zip" | tr -d '\r' | sed 's#^\./##' | sort)"
          [[ "$actual_windows" == "$expected_windows" ]] || { printf 'Unexpected Windows archive entries:\n%s\n' "$actual_windows" >&2; exit 1; }

      - name: Generate manifest, checksums, and provenance
        shell: bash
        working-directory: runtime-source
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          PROTOCOL_VERSION: ${{ needs.validate.outputs.protocol_version }}
          RUNTIME_COMMIT: ${{ needs.validate.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp dist/assets/kition-runtime-* dist/release/
          node build/generate-release-metadata.mjs \
            --version "$VERSION" \
            --release-tag "$RELEASE_TAG" \
            --protocol-version "$PROTOCOL_VERSION" \
            --assets-dir dist/release \
            --output-dir dist/release \
            --build-commit "$RUNTIME_COMMIT" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate binary SBOMs
        shell: bash
        working-directory: runtime-source
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 windows-x64 linux-x64; do
            extension=tar.gz
            if [[ "$target" == windows-* ]]; then extension=zip; fi
            archive="dist/release/kition-runtime-$VERSION-$target.$extension"
            syft scan "$archive" --output "spdx-json=dist/release/runtime-sbom-$target.spdx.json"
          done

      - name: Verify generated release assets
        working-directory: runtime-source
        run: node build/verify-release-assets.mjs dist/release

      - name: Refuse source or credential files in release output
        shell: bash
        working-directory: runtime-source
        run: |
          set -euo pipefail
          if find dist/release -type f \( \
            -name '*.go' -o -name 'go.mod' -o -name 'go.sum' -o \
            -name '*.p8' -o -name '*.p12' -o -name '*.pem' -o \
            -name '*.key' -o -name '*.db' -o -name '*.log' \
          \) | grep -q .; then
            echo "Release output contains a forbidden file type" >&2
            exit 1
          fi

      - name: Upload verified runtime release artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-release-assets-${{ needs.validate.outputs.version }}
          path: runtime-source/dist/release/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload assets to runtime draft Release
        shell: bash
        working-directory: runtime-source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')"
          if [[ "$draft" != "true" ]]; then
            echo "Runtime Release $RELEASE_TAG must be a draft" >&2
            exit 1
          fi
          mapfile -d '' files < <(find dist/release -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

      - name: Upload assets to installer draft Release
        shell: bash
        working-directory: runtime-source
        env:
          GH_TOKEN: ${{ secrets.KITION_PUBLIC_RELEASE_TOKEN }}
          PUBLIC_REPOSITORY: ${{ inputs.public_repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "KITION_PUBLIC_RELEASE_TOKEN is required" >&2
            exit 1
          fi
          draft="$(gh api "repos/$PUBLIC_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')"
          if [[ "$draft" != "true" ]]; then
            echo "Installer Release $RELEASE_TAG must be a draft" >&2
            exit 1
          fi
          mapfile -d '' files < <(find dist/release -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" --repo "$PUBLIC_REPOSITORY" --clobber "${files[@]}"

      - name: Verify staged installer assets
        shell: bash
        working-directory: runtime-source
        env:
          GH_TOKEN: ${{ secrets.KITION_PUBLIC_RELEASE_TOKEN }}
          PUBLIC_REPOSITORY: ${{ inputs.public_repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/$PUBLIC_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name')"
          while IFS= read -r file; do
            name="$(basename "$file")"
            if ! grep -Fxq "$name" <<<"$assets"; then
              echo "Missing staged installer asset: $name" >&2
              exit 1
            fi
          done < <(find dist/release -maxdepth 1 -type f -print | sort)

      - name: Verify and publish runtime Release
        shell: bash
        working-directory: runtime-source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
            echo "Runtime Release $RELEASE_TAG must remain a draft until verification completes" >&2
            exit 1
          fi
          assets="$(jq -r '.assets[].name' <<<"$release_json")"
          while IFS= read -r file; do
            name="$(basename "$file")"
            if ! grep -Fxq "$name" <<<"$assets"; then
              echo "Missing runtime Release asset: $name" >&2
              exit 1
            fi
          done < <(find dist/release -maxdepth 1 -type f -print | sort)
          prerelease=false
          if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease="$prerelease"
